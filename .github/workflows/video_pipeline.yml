name: Free Gemini Video Agent

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "موضوع الفيديو"
        required: false
        default: "حقيقة مذهلة من التاريخ"
      script:
        description: "سكريبت جاهز من Gemini (اختياري)"
        required: false
        default: ""
  schedule:
    - cron: "0 4,10,16,22 * * *"

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Python packages
        run: |
          # GitHub-hosted Ubuntu images often already include FFmpeg.
          # Avoid a slow/flaky Ubuntu mirror download when it is available.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg is missing; installing it from Ubuntu packages."
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y ffmpeg
          else
            echo "FFmpeg is already available: $(ffmpeg -version | head -n 1)"
          fi
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create video and images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_VERSION: v26.0
          VIDEO_TOPIC: ${{ inputs.topic || 'فيديو معلوماتي عربي' }}
          SCRIPT_TEXT: ${{ inputs.script || '' }}
        run: python src/video_agent.py
      - name: Upload video, images, voice and script
        uses: actions/upload-artifact@v4
        with:
          name: generated-video-${{ github.run_number }}
          path: output/
          retention-days: 7
