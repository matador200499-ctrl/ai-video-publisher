name: Free Gemini Video Agent

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "موضوع الفيديو"
        required: false
        default: "حقيقة مذهلة من التاريخ"
      script:
        description: "سكريبت جاهز من Gemini (اختياري)"
        required: false
        default: ""
  schedule:
    - cron: "0 4,10,16,22 * * *"

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
      - name: Create video and images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VIDEO_TOPIC: ${{ inputs.topic || 'فيديو معلوماتي عربي' }}
          SCRIPT_TEXT: ${{ inputs.script || '' }}
        run: python src/video_agent.py
      - name: Upload video, images, voice and script
        uses: actions/upload-artifact@v4
        with:
          name: generated-video-${{ github.run_number }}
          path: output/
          retention-days: 7
