name: AI Video Publisher

on:
  workflow_dispatch:

  schedule:
    # سيتم ضبط الأوقات لاحقًا بناءً على بيانات التفاعل.
    # UTC times
    - cron: "0 8 * * *"
    - cron: "0 12 * * *"
    - cron: "0 16 * * *"
    - cron: "0 20 * * *"

jobs:
  video-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select topic
        run: |
          python src/topic_picker.py

      - name: Commit topic history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/topics.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update topic history"
            git push
          fi
